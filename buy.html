<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PennCamm — Custom Quote Creator</title>
<style>
  :root{
    --bg:#0b0e12;
    --panel:#0f1418;
    --muted:#9aa4af;
    --accent:#6ee7b7;
    --glass: rgba(255,255,255,0.03);
    --card:#0d1114;
    --danger:#ff6b6b;
  }
  *{box-sizing:border-box;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
  body{margin:0;background:linear-gradient(180deg,#050607 0%, #0b0e12 100%);color:#e6eef3;min-height:100vh;display:flex;align-items:stretch;padding:18px;}
  .app{max-width:1400px;margin:0 auto;width:100%;display:grid;grid-template-columns:540px 1fr;gap:18px;align-items:start;}
  /* PREVIEW */
  .preview {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    border-radius:12px;padding:14px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.03);
  }
  .preview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .brand{font-weight:700;letter-spacing:1px}
  .canvas-wrap{background:var(--card);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;height:calc(100vw * 0.5); /* responsive */ max-height:720px; min-height:360px; position:relative;}
  .stack{width:100%;max-width:560px;aspect-ratio:1/1;position:relative;background:#091014;border-radius:6px;overflow:hidden;}
  .stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transition:opacity .18s ease, filter .18s ease;opacity:0}
  .stack img.visible{opacity:1}
  /* tint overlay (temporary color) */
  .stack .tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:0;transition:opacity .18s}
  .stack.tinted .tint{opacity:0.25}
  /* RIGHT PANEL */
  .controls{background:var(--panel);padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);height:100%;display:flex;flex-direction:column;gap:12px;overflow:hidden}
  .types{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-right:6px}
  .type-btn{background:transparent;border:1px solid transparent;padding:10px 12px;border-radius:8px;text-align:left;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .type-btn.active{border-color:rgba(255,255,255,0.06);color:#fff;background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent)}
  .subtypes{display:flex;gap:10px;overflow:auto;padding:10px 4px}
  .subtype{flex:0 0 auto;min-width:120px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.02);cursor:pointer;text-align:center}
  .subtype.active{outline:2px solid rgba(110,231,183,0.12);box-shadow:0 6px 18px rgba(0,0,0,0.6)}
  .options-grid{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;max-height:220px;overflow:auto}
  .option{width:92px;height:92px;flex:0 0 auto;background:rgba(255,255,255,0.02);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,0.02)}
  .option.selected{border-color:var(--accent);box-shadow:0 4px 16px rgba(110,231,183,0.06)}
  .option small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
  .footer{margin-top:auto;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .price{font-weight:700;font-size:18px}
  .btn{background:linear-gradient(90deg, rgba(255,255,255,0.03), transparent);border:1px solid rgba(255,255,255,0.06);padding:10px 12px;border-radius:10px;color:var(--accent);cursor:pointer}
  .btn.ghost{background:transparent;color:var(--muted)}
  .search{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);background:rgba(255,255,255,0.01);color:var(--muted)}
  /* summary / selected list */
  .selected-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow:auto;padding:6px}
  .selected-item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px;border-radius:6px;background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.02)}
  .sku{font-size:12px;color:var(--muted)}
  /* responsive */
  @media (max-width:980px){.app{grid-template-columns:1fr;}.canvas-wrap{height:60vw}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="preview">
    <div class="preview-header">
      <div class="brand">PennCamm — Custom Quote Creator</div>
      <div class="meta" id="metaSummary">Items: 0 • Total: $0.00</div>
    </div>
    <div class="canvas-wrap">
      <div class="stack" id="stack" aria-live="polite" title="Layered preview">
        <!-- images injected here -->
        <div class="tint" id="tintLayer"></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
      <label style="font-size:13px;color:var(--muted)">Temporary tint:</label>
      <input id="tintColor" type="color" value="#6ee7b7" style="height:34px;border-radius:6px"/>
      <label style="font-size:13px;color:var(--muted);margin-left:6px"><input id="tintToggle" type="checkbox" checked/> enable</label>
      <div style="margin-left:auto">
        <button class="btn" id="downloadQuote">Export Quote (JSON)</button>
        <button class="btn ghost" id="clearAll">Clear</button>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <div style="display:flex;align-items:center;gap:8px">
      <input id="search" class="search" placeholder="Search types / names / SKU" />
      <div style="margin-left:auto;color:var(--muted);font-size:13px">Tip: Lenses & Misc are multi-select</div>
    </div>

    <div style="display:flex;gap:12px;align-items:flex-start">
      <div style="width:220px">
        <div style="font-size:13px;color:var(--muted);margin-bottom:8px">Types</div>
        <div class="types" id="typesList" role="list"></div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="font-size:13px;color:var(--muted)">Subtypes</div>
            <div style="font-size:12px;color:var(--muted)">Scroll →</div>
          </div>
          <div class="subtypes" id="subtypesRow"></div>
          <div style="font-size:13px;color:var(--muted)">Options</div>
          <div class="options-grid" id="optionsGrid"></div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:12px">
      <div style="flex:1">
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Selected</div>
        <div class="selected-list" id="selectedList"></div>
      </div>
      <div style="width:260px">
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Quote</div>
        <div style="background:var(--glass);padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.02)">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div class="price" id="totalPrice">$0.00</div>
            <div style="text-align:right">
              <div style="font-size:12px;color:var(--muted)">Items: <span id="itemCount">0</span></div>
              <div style="font-size:12px;color:var(--muted)">VAT/N/A</div>
            </div>
          </div>
          <div style="margin-top:10px;display:flex;gap:8px">
            <button class="btn" id="checkout">Create Quote</button>
            <button class="btn ghost" id="downloadImage">Save Preview</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/*
  Behavior:
  - Loads data.json (same folder) and builds types -> subtypes -> options.
  - Clicking a type activates it and reveals subtypes horizontally.
  - Clicking subtype shows options underneath.
  - Options: clicking selects (single-select per type except Lens and Misc which allow multi).
  - Selected SKUs are layered in left preview: images/<SKU>.png
  - If the last-selected option has view:"interior", hide all other layers (show interior only).
  - Temporary tint overlay controlled via color input and enable toggle.
  - Export Quote -> downloads JSON with selections and totals.
  - Easy to extend: edit data.json (array of items). Each item:
    { "sku","type","subtype","name","price", "image":"images/SKU.png", "view": "exterior"|"interior" (optional) }
*/

const DATA_FILE = 'data.json';
let data = [];
let types = []; // list of types
let currentType = null;
let currentSubtype = null;
let selections = {}; // type -> selected SKU(s) (string or array)

const $ = id=>document.getElementById(id);
const typesList = $('typesList');
const subtypesRow = $('subtypesRow');
const optionsGrid = $('optionsGrid');
const stack = $('stack');
const tintLayer = $('tintLayer');
const tintColor = $('tintColor');
const tintToggle = $('tintToggle');
const metaSummary = $('metaSummary');
const totalPriceEl = $('totalPrice');
const itemCountEl = $('itemCount');
const selectedList = $('selectedList');
const downloadQuote = $('downloadQuote');
const clearAll = $('clearAll');
const search = $('search');

function money(n){ return '$' + Number(n||0).toFixed(2); }

async function loadData(){
  try{
    const res = await fetch(DATA_FILE);
    data = await res.json();
  }catch(e){
    console.error('Failed to load data.json', e);
    data = [];
  }
  // build type/subtype structure
  const typeMap = {};
  data.forEach(it=>{
    if(!typeMap[it.type]) typeMap[it.type] = {};
    if(!typeMap[it.type][it.subtype]) typeMap[it.type][it.subtype] = [];
    typeMap[it.type][it.subtype].push(it);
  });
  types = Object.keys(typeMap).map(t=>{
    return { name: t, subtypes: Object.keys(typeMap[t]).map(st=>({ name: st, items: typeMap[t][st] })) };
  });
  renderTypes();
  // by default select first type
  if(types.length) selectType(types[0].name);
}

function renderTypes(filter){
  typesList.innerHTML = '';
  const filtered = filter ? types.filter(t=> t.name.toLowerCase().includes(filter) || t.subtypes.some(st=>st.name.toLowerCase().includes(filter))) : types;
  filtered.forEach(t=>{
    const btn = document.createElement('button');
    btn.className = 'type-btn';
    btn.textContent = t.name;
    btn.onclick = ()=> selectType(t.name);
    typesList.appendChild(btn);
  });
  updateTypeActive();
}

function selectType(typeName){
  currentType = types.find(t=>t.name===typeName) || null;
  updateTypeActive();
  renderSubtypes();
  optionsGrid.innerHTML = '';
  currentSubtype = null;
}

function updateTypeActive(){
  Array.from(typesList.children).forEach(ch=>{
    ch.classList.toggle('active', currentType && ch.textContent===currentType.name);
  });
}

function renderSubtypes(){
  subtypesRow.innerHTML = '';
  if(!currentType) return;
  currentType.subtypes.forEach(st=>{
    const el = document.createElement('div');
    el.className = 'subtype';
    el.textContent = st.name + ' (' + st.items.length + ')';
    el.onclick = ()=> selectSubtype(st.name);
    subtypesRow.appendChild(el);
  });
  // auto-select first subtype
  if(currentType.subtypes.length) selectSubtype(currentType.subtypes[0].name);
  updateSubtypeActive();
}

function selectSubtype(name){
  currentSubtype = (currentType && currentType.subtypes.find(s=>s.name===name)) || null;
  updateSubtypeActive();
  renderOptions();
}

function updateSubtypeActive(){
  Array.from(subtypesRow.children).forEach(ch=>{
    ch.classList.toggle('active', currentSubtype && ch.textContent.startsWith(currentSubtype.name));
  });
}

function renderOptions(){
  optionsGrid.innerHTML = '';
  if(!currentSubtype) return;
  currentSubtype.items.forEach(item=>{
    const opt = document.createElement('div');
    opt.className = 'option';
    opt.title = item.sku + ' — ' + item.name;
    const inner = document.createElement('div');
    inner.style.fontSize='13px';
    inner.style.fontWeight='600';
    inner.textContent = item.name;
    const sku = document.createElement('small');
    sku.textContent = item.sku + ' • ' + money(item.price);
    opt.appendChild(inner);
    opt.appendChild(sku);
    // click selects
    opt.onclick = (e)=>{
      handleOptionClick(item);
      e.stopPropagation();
    };
    optionsGrid.appendChild(opt);
  });
  refreshOptionSelections();
}

function handleOptionClick(item){
  const multiTypes = ['Lens','Misc']; // multi-select types
  const isMulti = multiTypes.includes(item.type);
  if(!selections[item.type]) selections[item.type] = isMulti ? [] : null;

  if(isMulti){
    // toggle in array
    const arr = selections[item.type];
    const idx = arr.indexOf(item.sku);
    if(idx===-1) arr.push(item.sku);
    else arr.splice(idx,1);
  }else{
    // single-select; toggle off if same
    if(selections[item.type]===item.sku) selections[item.type]=null;
    else selections[item.type]=item.sku;
  }
  refreshOptionSelections();
  updatePreviewLayers();
  updateSummary();
}

function refreshOptionSelections(){
  Array.from(optionsGrid.children).forEach(opt=>{
    opt.classList.remove('selected');
  });
  // for current subtype only, mark selected items
  if(!currentSubtype) return;
  const multiTypes = ['Lens','Misc'];
  currentSubtype.items.forEach(item=>{
    const isMulti = multiTypes.includes(item.type);
    if(isMulti && selections[item.type] && selections[item.type].includes(item.sku)){
      // find DOM node
      Array.from(optionsGrid.children).forEach(opt=>{
        if(opt.title && opt.title.startsWith(item.sku)) opt.classList.add('selected');
      });
    }else if(!isMulti && selections[item.type]===item.sku){
      Array.from(optionsGrid.children).forEach(opt=>{
        if(opt.title && opt.title.startsWith(item.sku)) opt.classList.add('selected');
      });
    }
  });
}

function updatePreviewLayers(){
  // clear images then re-add in order of types for consistent stacking
  const orderedTypes = types.map(t=>t.name);
  // remove existing imgs
  Array.from(stack.querySelectorAll('img')).forEach(img=>img.remove());
  // prepare a list of selected items (flatten)
  const selectedItems = [];
  orderedTypes.forEach(tn=>{
    const sel = selections[tn];
    if(!sel) return;
    if(Array.isArray(sel)) sel.forEach(sku=>{
      const it = data.find(d=>d.sku===sku);
      if(it) selectedItems.push(it);
    });
    else {
      const it = data.find(d=>d.sku===sel);
      if(it) selectedItems.push(it);
    }
  });

  // If last selected option has view == 'interior', show only that interior image
  if(selectedItems.length){
    const last = selectedItems[selectedItems.length-1];
    if(last && last.view === 'interior'){
      // show only last
      addLayerForItem(last);
      return;
    }
  }

  // otherwise add all selected in order
  selectedItems.forEach(it=> addLayerForItem(it));
}

function addLayerForItem(item){
  const img = document.createElement('img');
  img.dataset.sku = item.sku;
  img.alt = item.sku + ' layer';
  img.src = item.image || ('images/' + item.sku + '.png');
  // show image once loaded to avoid flicker
  img.onload = ()=> img.classList.add('visible');
  img.onerror = ()=> {
    // placeholder for missing images
    img.classList.add('visible');
    img.style.objectFit = 'contain';
    img.style.background = '#081018';
    img.style.filter='grayscale(0.6) brightness(.9)';
    img.src = '';
  };
  stack.appendChild(img);
}

function updateTint(){
  const c = tintColor.value;
  tintLayer.style.background = c;
  if(tintToggle.checked) stack.classList.add('tinted');
  else stack.classList.remove('tinted');
}

function updateSummary(){
  let total = 0;
  let count = 0;
  const flat = [];
  Object.keys(selections).forEach(t=>{
    const sel = selections[t];
    if(!sel) return;
    if(Array.isArray(sel)){
      sel.forEach(sku=>{
        const it = data.find(d=>d.sku===sku);
        if(it){ total += Number(it.price || 0); flat.push(it); count++; }
      });
    }else{
      const it = data.find(d=>d.sku===sel);
      if(it){ total += Number(it.price || 0); flat.push(it); count++; }
    }
  });
  totalPriceEl.textContent = money(total);
  metaSummary.textContent = 'Items: ' + count + ' • Total: ' + money(total);
  itemCountEl.textContent = count;

  // render selected list
  selectedList.innerHTML = '';
  flat.forEach(it=>{
    const el = document.createElement('div');
    el.className = 'selected-item';
    el.innerHTML = '<div><div style="font-weight:600">'+it.name+'</div><div class="sku">'+it.sku+' • '+it.type+' • '+it.subtype+'</div></div><div style="text-align:right"><div style="font-weight:700">'+money(it.price)+'</div><small style="color:var(--muted)">'+(it.view||'exterior')+'</small></div>';
    selectedList.appendChild(el);
  });
}

downloadQuote.addEventListener('click', ()=>{
  const payload = {
    created: new Date().toISOString(),
    items: getSelectedItems(),
    total: totalPriceEl.textContent
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'penncamm-quote-'+Date.now()+'.json';
  a.click();
  URL.revokeObjectURL(url);
});

function getSelectedItems(){
  const out = [];
  Object.keys(selections).forEach(t=>{
    const sel = selections[t];
    if(!sel) return;
    if(Array.isArray(sel)){
      sel.forEach(sku=>{
        const it = data.find(d=>d.sku===sku); if(it) out.push(it);
      });
    }else{
      const it = data.find(d=>d.sku===sel); if(it) out.push(it);
    }
  });
  return out;
}

clearAll.addEventListener('click', ()=>{
  selections = {};
  updatePreviewLayers();
  updateSummary();
  refreshOptionSelections();
  // unselect type/subtype
  currentType = null; currentSubtype = null;
  updateTypeActive();
  subtypesRow.innerHTML = ''; optionsGrid.innerHTML = '';
});

tintColor.addEventListener('input', updateTint);
tintToggle.addEventListener('change', updateTint);

$('checkout').addEventListener('click', ()=>{
  alert('Quote created. Use Export Quote to download JSON.'); // placeholder
});

$('downloadImage').addEventListener('click', ()=>{
  // simple capture: combine images already stacked onto canvas
  const imgs = Array.from(stack.querySelectorAll('img.visible'));
  if(!imgs.length){ alert('No layers to save'); return; }
  // create canvas 1000x1000
  const canvas = document.createElement('canvas');
  canvas.width = 1000; canvas.height = 1000;
  const ctx = canvas.getContext('2d');
  // draw images in DOM order
  const promises = imgs.map(img=>{
    return new Promise(res=>{
      const tmp = new Image();
      tmp.crossOrigin = 'anonymous';
      tmp.onload = ()=> { res(tmp); };
      tmp.onerror = ()=> { res(null); };
      tmp.src = img.src;
    });
  });
  Promise.all(promises).then(imgs2=>{
    imgs2.forEach(im=>{
      if(im) ctx.drawImage(im,0,0,1000,1000);
    });
    // tint if enabled
    if(tintToggle.checked){
      ctx.globalCompositeOperation = 'overlay';
      ctx.fillStyle = tintColor.value;
      ctx.fillRect(0,0,1000,1000);
      ctx.globalCompositeOperation = 'source-over';
    }
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'preview-'+Date.now()+'.png';
    a.click();
  });
});

search.addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  renderTypes(q);
});

function updateUIAfterLoad(){
  updateTint();
  updateSummary();
}

// initial load
loadData().then(updateUIAfterLoad);

</script>
</body>
</html>
