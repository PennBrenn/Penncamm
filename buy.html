<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PennCamm — Custom Quote Creator</title>
  <style>
    :root{
      --bg:#07070a; --panel:#0f1316; --muted:#9aa3a8; --accent:#465e73; --glass:rgba(255,255,255,0.03);
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--muted);font-family:Helvetica,Arial,sans-serif}
    .app{display:flex;gap:20px;align-items:stretch;padding:18px;height:100%;box-sizing:border-box}
    .left{flex:0 0 58%;min-width:320px;display:flex;flex-direction:column;align-items:center}
    .viewer{background:#000;border-radius:8px;padding:12px;box-shadow:0 6px 30px rgba(0,0,0,0.7);width:100%;max-width:920px;display:flex;justify-content:center}
    .stack{position:relative;width:100%;height:0;padding-bottom:100%;background:#111;overflow:hidden;border-radius:6px}
    .stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .18s linear;opacity:0}
    .stack img.visible{opacity:1}
    .right{flex:0 0 40%;min-width:300px;display:flex;flex-direction:column;gap:12px}
    .panel{background:var(--panel);border-radius:10px;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.02)}
    h2{color:#fafdff;font-family:Courier,monospace;margin:6px 0}
    .types{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
    .type-btn{background:transparent;border:1px solid transparent;padding:10px 12px;text-align:left;border-radius:6px;color:var(--muted);cursor:pointer}
    .type-btn.active{background:var(--glass);border-color:rgba(255,255,255,0.04);color:#fff}
    .subtypes{display:flex;gap:8px;padding:8px 6px;overflow:auto}
    .subchip{white-space:nowrap;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.02);cursor:pointer;border:1px solid transparent}
    .subchip.active{background:linear-gradient(90deg,var(--accent),#32464f);color:#fff}
    .options-grid{display:flex;flex-direction:column;gap:8px;max-height:28vh;overflow:auto}
    .option{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;background:rgba(255,255,255,0.01);cursor:pointer}
    .option input{transform:scale(1.1)}
    .footer{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .quote-box{width:100%;height:110px;background:#050608;border-radius:8px;padding:8px;resize:none;color:var(--muted);font-family:monospace}
    .btn{background:var(--accent);color:#fff;padding:10px 12px;border-radius:8px;border:0;cursor:pointer}
    .muted{color:var(--muted);font-size:13px}
    @media(max-width:900px){.app{flex-direction:column}.left,.right{flex:1 1 auto;width:100%}}
  </style>
</head>
<body>
  <div class="app">
    <div class="left">
      <div class="viewer panel">
        <div class="stack" id="stack" aria-label="Product preview (layers)"></div>
      </div>
      <div style="margin-top:12px;width:100%;max-width:920px;display:flex;gap:10px;justify-content:space-between;align-items:center">
        <div class="muted">All images are 1000×1000 and layered. Images located at <code>images/&lt;SKU&gt;.png</code></div>
        <div class="muted">Dark theme • Temporary colors</div>
      </div>
    </div>

    <div class="right">
      <div class="panel">
        <h2>Customize — PennCamm</h2>
        <div class="muted">Select a Type. Then choose a Subtype and an Option.</div>
      </div>

      <div class="panel">
        <div class="types" id="types"></div>
      </div>

      <div class="panel">
        <div id="subtypes" class="subtypes"></div>
        <div id="options" class="options-grid" style="margin-top:8px"></div>
      </div>

      <div class="panel">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <button id="selectAll" class="btn">Select All (for Lenses & Misc)</button>
          <div class="muted">Clear selections to reset</div>
        </div>
        <textarea id="quote" class="quote-box" placeholder="Quote (copy and email to cam@pennbrenn.com)"></textarea>
        <div class="footer" style="margin-top:8px">
          <div class="muted">Total: <strong id="total">$0.00</strong></div>
          <div style="display:flex;gap:8px">
            <button id="copyQuote" class="btn">Copy Quote</button>
            <button id="reset" class="btn" style="background:#2b2f31">Reset</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Basic app logic
    const options = JSON.parse(document.getElementById('options-json').textContent);
    const typesContainer = document.getElementById('types');
    const subtypesContainer = document.getElementById('subtypes');
    const optionsContainer = document.getElementById('options');
    const stack = document.getElementById('stack');
    const quoteBox = document.getElementById('quote');
    const totalEl = document.getElementById('total');
    const selectAllBtn = document.getElementById('selectAll');

    let state = { type:null, subtype:null, selections: [] }; // selections: array of SKUs (for multi/select)

    // build types list
    const types = [...new Set(options.map(o=>o.type))];
    types.forEach(t=>{
      const btn = document.createElement('button'); btn.className='type-btn'; btn.textContent=t;
      btn.onclick = ()=> selectType(t, btn);
      typesContainer.appendChild(btn);
    });

    function clearActives(container, cls='active'){
      container.querySelectorAll('.'+cls).forEach(el=>el.classList.remove(cls));
    }

    function selectType(t,btn){
      state.type = t; state.subtype = null; state.selections = state.selections.filter(sku=> getOptionBySku(sku).type !== t);
      clearActives(typesContainer); btn.classList.add('active');
      renderSubtypes(); renderOptions(); syncStack(); updateQuote();
    }

    function renderSubtypes(){
      subtypesContainer.innerHTML='';
      if(!state.type) return;
      const subs = [...new Set(options.filter(o=>o.type===state.type).map(o=>o.subtype))];
      subs.forEach(s=>{
        const chip = document.createElement('div'); chip.className='subchip'; chip.textContent=s;
        chip.onclick = ()=> { state.subtype = s; clearActives(subtypesContainer); chip.classList.add('active'); renderOptions(); }
        subtypesContainer.appendChild(chip);
      });
    }

    function renderOptions(){
      optionsContainer.innerHTML='';
      if(!state.type || !state.subtype) return;
      const opts = options.filter(o=>o.type===state.type && o.subtype===state.subtype);
      opts.forEach(o=>{
        const row = document.createElement('label'); row.className='option';
        const input = document.createElement('input');
        const isMulti = ['Lens','Misc'].includes(o.type);
        input.type = isMulti ? 'checkbox' : 'radio';
        input.name = 'opt-'+o.type;
        input.checked = state.selections.includes(o.sku);
        input.onchange = ()=> toggleSelection(o.sku, isMulti);
        row.appendChild(input);
        const span = document.createElement('div'); span.innerHTML = `<strong style="color:#fff">${o.item}</strong><div class="muted">${o.sku} • $${o.price.toFixed(2)}</div>`;
        row.appendChild(span);
        optionsContainer.appendChild(row);
      });
    }

    function toggleSelection(sku, multi){
      const idx = state.selections.indexOf(sku);
      if(multi){
        if(idx===-1) state.selections.push(sku); else state.selections.splice(idx,1);
      } else {
        // single-select: remove type's previous
        state.selections = state.selections.filter(s=> getOptionBySku(s).type !== getOptionBySku(sku).type);
        state.selections.push(sku);
      }
      syncStack(); renderOptions(); updateQuote();
    }

    function getOptionBySku(sku){ return options.find(o=>o.sku===sku);
    }

    function syncStack(){
      // Rebuild layered images based on selections, ordered by type appearance
      stack.innerHTML='';
      // If last selected item contains 'interior' (case-insensitive) -> show only that image
      const last = state.selections.length? getOptionBySku(state.selections[state.selections.length-1]) : null;
      const interiorMode = last && (last.item||'').toLowerCase().includes('interior');
      const toShow = interiorMode ? [last.sku] : state.selections;
      // maintain order by types array
      const orderedSkus = [];
      types.forEach(t=>{ state.selections.filter(s=> getOptionBySku(s).type===t).forEach(s=> orderedSkus.push(s)); });
      const finalSkus = interiorMode ? toShow : orderedSkus;
      finalSkus.forEach(sku=>{
        const img = document.createElement('img'); img.dataset.sku = sku; img.alt = sku; img.src = `images/${sku}.png`;
        img.onload = ()=> img.classList.add('visible');
        stack.appendChild(img);
      });
      // if nothing selected show placeholder
      if(finalSkus.length===0){
        const ph = document.createElement('div'); ph.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2f373b;font-size:14px'; ph.textContent='No layers selected — pick options to visualize your camera'; stack.appendChild(ph);
      }
    }

    function updateQuote(){
      const lines = [];
      let total = 0;
      state.selections.forEach(sku=>{
        const o = getOptionBySku(sku);
        if(o){ lines.push(`${o.sku} — ${o.type} / ${o.subtype} / ${o.item} — $${o.price.toFixed(2)}`); total += Number(o.price);
        }
      });
      const totals = `\nTotal: $${total.toFixed(2)}\nEmail to: cam@pennbrenn.com`;
      quoteBox.value = lines.join('\n') + (lines.length? totals : '\n(Select items to build a quote)');
      totalEl.textContent = `$${total.toFixed(2)}`;
    }

    selectAllBtn.onclick = ()=>{
      if(!state.type) return alert('Select a type first (Lens or Misc)');
      if(!['Lens','Misc'].includes(state.type)) return alert('Select the Lens or Misc type to use Select All');
      const skus = options.filter(o=>o.type===state.type).map(o=>o.sku);
      // ensure no duplicates
      skus.forEach(sku=>{ if(!state.selections.includes(sku)) state.selections.push(sku); });
      renderOptions(); syncStack(); updateQuote();
    }

    document.getElementById('copyQuote').onclick = ()=>{ quoteBox.select(); document.execCommand('copy'); alert('Quote copied to clipboard — paste into an email to cam@pennbrenn.com'); }
    document.getElementById('reset').onclick = ()=>{ state={type:null,subtype:null,selections:[]}; clearActives(typesContainer); clearActives(subtypesContainer); optionsContainer.innerHTML=''; syncStack(); updateQuote(); }

    // init placeholder
    syncStack();
  </script>
</body>
</html>
